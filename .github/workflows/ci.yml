name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Ensure working tree clean (no unbuilt artifacts)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Repository has uncommitted changes after build (likely missing build artifacts in commit)." >&2
            git status --porcelain
            exit 1
          fi

      - name: Install example dependencies
        run: npm ci
        working-directory: example

      - name: Typecheck example
        run: npm run typecheck
        working-directory: example

  android:
    name: Build Android (new arch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build Android
        uses: ./.github/actions/build-android

  ios:
    name: Build iOS (new arch)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build iOS
        uses: ./.github/actions/build-ios

  e2e-android:
    name: E2E Android (new arch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run E2E Android
        uses: ./.github/actions/e2e-android

  e2e-ios:
    name: E2E iOS (new arch)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run E2E iOS
        uses: ./.github/actions/e2e-ios
