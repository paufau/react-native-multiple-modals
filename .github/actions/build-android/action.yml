name: Build Android
description: >-
  Build the example app's Android (new arch)

inputs:
  rn-version:
    description: 'react-native version to force in the example (e.g. "nightly", "0.84"). Empty = use the committed lockfile.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: example/package-lock.json

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
        cache: gradle

    - name: Install example dependencies
      shell: bash
      run: |
        if [ -n "${{ inputs.rn-version }}" ]; then
          npm --prefix example pkg set "overrides.react-native=${{ inputs.rn-version }}"
          npm --prefix example install --no-save --ignore-scripts
        else
          npm --prefix example ci --ignore-scripts
        fi

    - name: Build Android (assembleDebug, new arch)
      shell: bash
      run: ./gradlew assembleDebug -PnewArchEnabled=true -PreactNativeArchitectures=arm64-v8a --no-daemon
      working-directory: example/android
